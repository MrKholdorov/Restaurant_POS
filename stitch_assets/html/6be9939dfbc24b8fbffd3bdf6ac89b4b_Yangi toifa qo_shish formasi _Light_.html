<!DOCTYPE html><html lang="uz"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Safranbonu POS - Yangi Toifa</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">

                    "inverse-on-surface": "#f3f0ef",
                    "surface": "#fcf9f8",
                    "primary-fixed": "#ffdbc8",
                    "on-error": "#ffffff",
                    "surface-variant": "#e5e2e1",
                    "error-container": "#ffdad6",
                    "on-primary-container": "#5c2800",

                    "on-secondary-fixed-variant": "#00497d",
                    "surface-container-lowest": "#ffffff",
                    "on-primary": "#ffffff",
                    "secondary": "#0061a4",
                    "error": "#ba1a1a",
                    "on-tertiary-fixed-variant": "#7b008f",
                    "on-primary-fixed": "#321200",
                    "surface-tint": "#994700",
                    "inverse-primary": "#ffb68b",
                    "outline": "#8c7263",
                    "on-tertiary-fixed": "#35003f",
                    "surface-dim": "#dcd9d9",
                    "surface-container-low": "#f6f3f2",
                    "primary-container": "#ff7a00",
                    "secondary-container": "#33a0fd",
                    "on-secondary-container": "#00355c",
                    "inverse-surface": "#303030",
                    "outline-variant": "#e0c0af",
                    "on-tertiary-container": "#620072",
                    "on-secondary-fixed": "#001d36",
                    "on-primary-fixed-variant": "#753400",
                    "primary": "#994700",
                    "on-surface": "#1b1b1c",
                    "on-secondary": "#ffffff",
                    "on-surface-variant": "#584235",
                    "on-error-container": "#93000a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "spacing": {
                    "margin": "24px",
                    "base": "8px",
                    "sm": "12px",
                    "gutter": "20px",
                    "xs": "4px",
                    "lg": "24px",
                    "md": "16px",
                    "xl": "32px"
            },
            "fontFamily": {
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "label-lg": ["Inter"],
                    "display-lg": ["Inter"],

          },
        },
      }

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .modal-blur {
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e0c0af; border-radius: 10px; }
    </style>
</head>
<body class="bg-background text-on-background antialiased overflow-hidden">
<!-- Background Screen Simulation -->
<div class="fixed inset-0 z-0">
<img alt="Dashboard Background" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBs11FHMhhdTlwXxvD8efgGyOGwhCpD675tiB-JLBRvmWSGxVk-2tPgnlWzpi3WuN9mDuC-tICdFNRx7vCDSk46mf3pXXlfYfpgNsPP8BhrWDbmRvtNN65hIkXoddrqOQFqsPbtRlnuR72byOwUKVGMpbHSxMIaJs7NtZiGUMrwho2h_V8XYC9drug-RSap8TQBapV4tBMB6Wny-TmT8YnNt5TkvemI3Gw3b6EQxzN79vHnvQe33NYrSOijyvVUwXB9pFSCz93HZMe4">
<!-- Overlay to ensure readability and focus on modal -->
<div class="absolute inset-0 bg-on-background/20 modal-blur"></div>
</div>
<!-- Layout Shell (Suppressed for modal focus but following hierarchy) -->
<div class="relative z-10 flex h-screen">
<!-- SideNavBar (from JSON) - Rendered as background context -->
<aside class="fixed left-0 top-0 h-screen w-64 bg-surface-container-low border-r border-outline-variant flex flex-col h-full p-margin opacity-40 pointer-events-none">
<div class="mb-xl">
<h1 class="font-headline-md text-headline-md font-bold text-primary">Safranbonu</h1>
<p class="text-on-surface-variant font-label-md text-label-md opacity-70">POS Tizimi</p>
</div>
<nav class="flex-1 space-y-2">
<div class="flex items-center gap-3 text-on-surface-variant rounded-xl px-4 py-3">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-title-md text-title-md">Asosiy</span>
</div>
<!-- Expenses category context -->
<div class="flex items-center gap-3 bg-primary-container text-on-primary-container rounded-xl px-4 py-3">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-title-md text-title-md">Xarajatlar</span>
</div>
<div class="flex items-center gap-3 text-on-surface-variant rounded-xl px-4 py-3">
<span class="material-symbols-outlined" data-icon="restaurant_menu">restaurant_menu</span>
<span class="font-title-md text-title-md">Menyu</span>
</div>
</nav>
</aside>
<!-- Main Content Area -->
<main class="ml-64 flex-1 flex flex-col">
<!-- TopNavBar (from JSON) - Rendered as background context -->
<header class="flex justify-between items-center h-20 px-xl bg-surface-container-lowest border-b border-outline-variant shadow-sm opacity-40 pointer-events-none">
<h2 class="font-headline-md text-headline-md text-primary font-bold">Xarajat Kategoriyalari</h2>
<div class="flex items-center gap-md">
<div class="bg-surface-container-high px-4 py-2 rounded-full w-64 text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span>Qidirish...</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="notifications">notifications</span>
<div class="w-10 h-10 rounded-full bg-outline-variant"></div>
</div>
</header>
<!-- Modal Backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-gutter">
<!-- Modal Window -->
<div class="bg-surface-container-lowest w-full max-w-lg rounded-[32px] shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-300 flex flex-col max-h-[921px]">
<!-- Modal Header -->
<div class="px-xl pt-xl pb-6 flex items-center justify-between">
<div>
<h3 class="font-headline-md text-headline-md text-on-background">Yangi toifa qo'shish</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Xarajatlarni boshqarish uchun yangi guruh yarating</p>
</div>
<button class="w-10 h-10 rounded-full hover:bg-surface-container-high flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="close">close</span>
</button>
</div>
<!-- Modal Content (Form) -->
<div class="px-xl pb-xl flex-1 overflow-y-auto custom-scrollbar">
<form class="space-y-6">
<!-- Category Name -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-primary uppercase tracking-wider block">Toifa nomi</label>
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-4 font-body-lg text-body-lg focus:ring-2 focus:ring-primary-container transition-all" placeholder="Masalan: Oziq-ovqat, Ijara" type="text">
</div>
<!-- Icon Picker -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-primary uppercase tracking-wider block">Ikonka tanlash</label>
<div class="grid grid-cols-6 gap-3 p-4 bg-surface-container-low rounded-xl border border-outline-variant">
<button class="w-12 h-12 flex items-center justify-center rounded-lg bg-primary-container text-on-primary-container" type="button">
<span class="material-symbols-outlined" data-icon="shopping_basket">shopping_basket</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-lg hover:bg-surface-container-highest text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="home">home</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-lg hover:bg-surface-container-highest text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="electric_bolt">electric_bolt</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-lg hover:bg-surface-container-highest text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="directions_car">directions_car</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-lg hover:bg-surface-container-highest text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="restaurant">restaurant</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-lg hover:bg-surface-container-highest text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
</button>
</div>
</div>
<!-- Description -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-primary uppercase tracking-wider block">Tavsif</label>
<textarea class="w-full bg-surface-container-low border-none rounded-xl px-4 py-4 font-body-lg text-body-lg focus:ring-2 focus:ring-primary-container transition-all resize-none" placeholder="Toifa haqida qisqacha ma'lumot..." rows="3"></textarea>
</div>
<!-- Budget Limit -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-primary uppercase tracking-wider block">Budjet limiti (Ixtiyoriy)</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-4 pl-12 font-body-lg text-body-lg focus:ring-2 focus:ring-primary-container transition-all" placeholder="0.00" type="number">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-bold">UZS</span>
</div>
<p class="text-[11px] text-on-surface-variant italic">Oylik maksimal limit kiritish xarajatlarni nazorat qilishga yordam beradi.</p>
</div>
</form>
</div>
<!-- Modal Footer (Actions) -->
<div class="px-xl py-6 bg-surface-container-low flex items-center gap-4">
<button class="flex-1 py-4 px-6 rounded-xl font-title-md text-title-md text-on-surface-variant hover:bg-surface-container-highest transition-colors active:scale-[0.98]">
                            Bekor qilish
                        </button>
<button class="flex-1 py-4 px-6 rounded-xl font-title-md text-title-md bg-primary-container text-white shadow-lg shadow-primary-container/20 hover:opacity-90 transition-all active:scale-[0.98]">
                            Toifani saqlash
                        </button>
</div>
</div>
</div>
</main>
</div>
<!-- Decorative Elements / Interaction Script -->
<script>
        // Simple micro-interaction for icon selection
        const iconButtons = document.querySelectorAll('.grid button');
        iconButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                iconButtons.forEach(b => {
                    b.classList.remove('bg-primary-container', 'text-on-primary-container');
                    b.classList.add('hover:bg-surface-container-highest', 'text-on-surface-variant');
                });
                btn.classList.add('bg-primary-container', 'text-on-primary-container');
                btn.classList.remove('hover:bg-surface-container-highest', 'text-on-surface-variant');
            });
        });
    </script>
</body></html>
