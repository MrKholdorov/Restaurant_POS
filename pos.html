<!DOCTYPE html><html lang="uz"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Safranbonu POS - POS Sotuv</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="tailwind-config.js"></script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e0c0af; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #8c7263; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
    <link rel="stylesheet" href="premium.css">
</head>
<body class="bg-background text-on-surface flex h-screen overflow-hidden">

<!-- Sidebar Navigation -->
<aside></aside>

<!-- Main POS Canvas -->
<main class="ml-64 flex-1 flex h-full overflow-hidden bg-surface">
    <!-- Left: Floor Plan Section (35% width) -->
    <section class="w-[35%] h-full flex flex-col border-r border-outline-variant bg-surface-container-lowest">
        <header class="p-lg border-b border-outline-variant">
            <div class="flex items-center justify-between mb-md">
                <h2 class="font-headline-md text-headline-md text-primary">Stollar xaritasi</h2>
                <div class="flex items-center gap-2">
                    <button class="flex items-center gap-1 px-sm py-1 rounded-lg bg-surface-variant text-on-surface-variant font-label-md hover:bg-outline-variant transition-colors">
                        Asosiy Zal
                    </button>
                </div>
            </div>
            <!-- Room Selection Chips -->
            <div class="flex flex-wrap gap-xs" id="room-chips">
                <button class="room-chip px-md py-xs bg-primary text-on-primary rounded-full font-label-lg shadow-sm" onclick="filterRoom('Asosiy zal')">Asosiy zal</button>
                <button class="room-chip px-md py-xs bg-surface-variant text-on-surface-variant rounded-full font-label-lg hover:bg-outline-variant transition-colors" onclick="filterRoom('VIP')">VIP</button>
                <button class="room-chip px-md py-xs bg-surface-variant text-on-surface-variant rounded-full font-label-lg hover:bg-outline-variant transition-colors" onclick="filterRoom('Ayvon')">Ayvon</button>
            </div>
        </header>
        <div class="flex-1 overflow-hidden p-lg relative bg-surface-container-low custom-scrollbar" id="floor-plan">
            <!-- Floor Plan Background Grid -->
            <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#8c7263 1px, transparent 1px); background-size: 24px 24px;"></div>
            <!-- Tables will be loaded here dynamically -->
        </div>
    </section>

    <!-- Center: Product Catalog (40% width) -->
    <section class="w-[40%] h-full flex flex-col bg-surface border-r border-outline-variant">
        <header class="p-lg pb-0">
            <div class="relative w-full mb-md">
                <span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">search</span>
                <input id="product-search" class="w-full pl-xl pr-md py-md bg-surface-container-high border-none rounded-2xl focus:ring-2 focus:ring-primary font-body-md" placeholder="Taom yoki ichimlik qidirish..." type="text" oninput="filterProducts()">
            </div>
            <div class="flex overflow-x-auto gap-sm pb-md custom-scrollbar no-scrollbar" id="category-chips">
                <!-- Loaded dynamically -->
            </div>
        </header>
        <div class="flex-1 overflow-y-auto p-lg pt-0 grid grid-cols-2 xl:grid-cols-3 gap-md custom-scrollbar" id="product-grid">
            <!-- Product Cards loaded dynamically -->
        </div>
    </section>

    <!-- Right: Shopping Cart & Checkout (25% width) -->
    <section class="w-[25%] h-full flex flex-col bg-surface-container-low shadow-2xl z-20">
        <header class="p-lg border-b border-outline-variant flex items-center justify-between">
            <div>
                <h2 class="font-headline-md text-headline-md">Savat</h2>
                <p class="text-on-surface-variant font-label-lg">Stol: <span class="text-primary font-bold" id="cart-table-label">Tanlanmagan</span></p>
            </div>
            <button class="w-10 h-10 rounded-full flex items-center justify-center text-error hover:bg-error-container transition-colors" onclick="clearCart()">
                <span class="material-symbols-outlined">delete_sweep</span>
            </button>
        </header>
        
        <div class="px-lg py-sm border-b border-outline-variant bg-surface-container-low">
            <button class="w-full flex items-center justify-between p-sm bg-surface-container-low border border-outline-variant rounded-xl hover:bg-surface-variant transition-colors group" onclick="openCustomerModal()">
                <div class="flex items-center gap-md">
                    <div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                    <div class="flex flex-col items-start">
                        <span class="font-label-lg text-on-surface-variant" id="cart-customer-label">Mijoz tanlanmagan</span>
                        <span class="text-[10px] text-outline uppercase tracking-wider">Sodiqlik dasturi</span>
                    </div>
                </div>
                <span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
            </button>
        </div>
        
        <!-- Cart Items Container -->
        <div class="flex-1 overflow-y-auto p-md space-y-md custom-scrollbar" id="cart-items">
            <!-- Loaded dynamically -->
        </div>
        
        <!-- Total Summary & Payment -->
        <footer class="p-lg bg-surface-container-low border-t border-outline-variant space-y-md">
            <div class="space-y-xs">
                <div class="flex justify-between text-on-surface-variant font-body-md">
                    <span>Subtotal:</span>
                    <span id="cart-subtotal">0 UZS</span>
                </div>
                <div class="flex justify-between text-on-surface-variant font-body-md">
                    <span>Xizmat haqi (10%):</span>
                    <span id="cart-service">0 UZS</span>
                </div>
                <div class="flex justify-between text-on-surface-variant font-body-md">
                    <span>QQS (12%):</span>
                    <span id="cart-tax">0 UZS</span>
                </div>
                <div class="flex justify-between font-headline-md text-headline-md font-bold mt-sm pt-sm border-t border-outline-variant">
                    <span>Jami:</span>
                    <span class="text-primary" id="cart-total">0 UZS</span>
                </div>
            </div>
            <button class="w-full py-xl bg-primary text-on-primary font-headline-md rounded-2xl shadow-lg shadow-primary/20 hover:bg-surface-tint active:scale-95 transition-all flex items-center justify-center gap-md" onclick="proceedToCheckout()">
                <span class="material-symbols-outlined font-bold">check_circle</span>
                TO'LOVGA O'TISH
            </button>
        </footer>
    </section>
</main>

<!-- Customer Selection Modal -->
<div id="customer-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden backdrop-blur-sm">
    <div class="bg-surface-container-low rounded-2xl w-full max-w-md overflow-hidden shadow-2xl border border-outline-variant/30 flex flex-col h-[500px]">
        <header class="p-lg border-b border-outline-variant flex justify-between items-center bg-surface-container-low">
            <h3 class="font-title-lg text-title-lg font-bold text-primary">Mijoz tanlash</h3>
            <button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-surface-container-high" onclick="closeCustomerModal()">
                <span class="material-symbols-outlined">close</span>
            </button>
        </header>
        <div class="p-md border-b border-outline-variant">
            <input type="text" id="customer-search-input" class="w-full px-md py-sm bg-surface-container border-none rounded-xl focus:ring-2 focus:ring-primary font-body-md" placeholder="Qidiruv (Ism yoki telefon)..." oninput="filterModalCustomers()">
        </div>
        <div class="flex-1 overflow-y-auto p-md space-y-sm custom-scrollbar" id="modal-customer-list">
            <!-- Loaded dynamically -->
        </div>
        <footer class="p-md border-t border-outline-variant flex gap-md bg-surface-container-low">
            <button class="flex-1 py-sm bg-surface-container-low border border-outline-variant text-on-surface-variant rounded-xl font-bold hover:bg-surface-variant transition-colors" onclick="selectWalkInCustomer()">Walk-in (Mehmon)</button>
            <button class="flex-1 py-sm bg-primary text-on-primary rounded-xl font-bold hover:brightness-115" onclick="quickAddCustomerPrompt()">+ Yangi mijoz</button>
        </footer>
    </div>
</div>

<script src="db.js"></script>
<script src="shared.js"></script>
<script>
    let activeTableId = "T-01";
    let activeRoom = "Asosiy zal";
    let activeCategory = "All";
    let currentOrder = null;

    document.addEventListener("DOMContentLoaded", () => {
        // Initialize POS
        loadRoomChips();
        loadCategoryChips();
        renderTables();
        selectTable("T-01"); // default table
    });

    // 1. Rooms & Tables
    function filterRoom(room) {
        activeRoom = room;
        // update chips active state
        document.querySelectorAll(".room-chip").forEach(btn => {
            if (btn.innerText === room) {
                btn.className = "room-chip px-md py-xs bg-primary text-on-primary rounded-full font-label-lg shadow-sm";
            } else {
                btn.className = "room-chip px-md py-xs bg-surface-variant text-on-surface-variant rounded-full font-label-lg hover:bg-outline-variant transition-colors";
            }
        });
        renderTables();
    }

    function renderTables() {
        const floorPlan = document.getElementById("floor-plan");
        // Clear except grid background
        floorPlan.innerHTML = `<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#8c7263 1px, transparent 1px); background-size: 24px 24px;"></div>`;

        const tables = window.db.getTables().filter(t => t.room === activeRoom);
        
        tables.forEach(t => {
            const isActive = t.id === activeTableId;
            const isBand = t.status === "Band";
            
            let colorClasses = "";
            let statusText = "";
            let extraInfo = "";

            if (isBand) {
                // Get active order details
                const order = window.db.getOrders().find(o => o.tableId === t.id && o.status === "Faol");
                const amount = order ? new Intl.NumberFormat('uz-UZ').format(order.amount) + " UZS" : "0 UZS";
                
                colorClasses = isActive 
                    ? "bg-surface-container-low border-2 border-primary ring-4 ring-primary/20 scale-105" 
                    : "bg-surface-container-low border-2 border-primary-fixed-dim border-l-4 border-l-primary";
                statusText = `<span class="text-xs font-semibold text-primary">${amount}</span>`;
                extraInfo = `
                <div class="absolute -top-2 -right-2 bg-primary text-on-primary rounded-full p-0.5 shadow-sm">
                    <span class="material-symbols-outlined text-[12px] font-bold">timer</span>
                </div>
                <div class="flex items-center gap-1 text-[10px] text-on-surface-variant mt-1">
                    <span class="material-symbols-outlined text-xs">person</span> ${t.capacity}
                </div>`;
            } else {
                colorClasses = isActive 
                    ? "bg-surface-container-low border-2 border-green-500 ring-4 ring-green-500/20 scale-105" 
                    : "bg-surface-container-low border-2 border-green-200";
                statusText = `<span class="text-[10px] uppercase tracking-wider text-green-600 font-bold">Bo'sh</span>`;
            }

            const shapeClass = t.shape === "circle" ? "rounded-full w-24 h-24" : "rounded-xl w-36 h-24";
            
            const btnHtml = `
            <div class="absolute flex flex-col items-center justify-center shadow-sm hover:shadow-md cursor-pointer transition-all ${shapeClass} ${colorClasses}" 
                 style="top: ${t.y}; left: ${t.x};" onclick="selectTable('${t.id}')">
                <span class="font-bold text-on-surface">${t.id}</span>
                ${statusText}
                ${extraInfo}
            </div>
            `;
            floorPlan.innerHTML += btnHtml;
        });
    }

    function selectTable(tableId) {
        activeTableId = tableId;
        document.getElementById("cart-table-label").innerText = tableId;

        // Render tables to update active selection style
        renderTables();

        // Load or create order for this table
        const existingOrder = window.db.getActiveOrderForTable(tableId);
        if (existingOrder) {
            currentOrder = existingOrder;
        } else {
            currentOrder = {
                tableId: tableId,
                items: [],
                customerId: null,
                status: "Faol",
                amount: 0
            };
        }

        renderCart();
    }

    // 2. Product Catalog
    function loadCategoryChips() {
        const chipsContainer = document.getElementById("category-chips");
        const categories = window.db.getCategories();
        
        let html = `
        <button class="cat-btn whitespace-nowrap px-lg py-sm bg-primary-container text-on-primary-container rounded-xl font-title-md flex items-center gap-2" onclick="selectCategory('All')">
            <span class="material-symbols-outlined">restaurant_menu</span> Barchasi
        </button>
        `;

        categories.forEach(c => {
            let icon = "restaurant";
            if (c.name.toLowerCase().includes("ichimlik")) icon = "local_bar";
            else if (c.name.toLowerCase().includes("desert") || c.name.toLowerCase().includes("shirinlik")) icon = "icecream";
            else if (c.name.toLowerCase().includes("salat")) icon = "eco";

            html += `
            <button class="cat-btn whitespace-nowrap px-lg py-sm bg-surface-container-low border border-outline-variant text-on-surface-variant rounded-xl font-title-md flex items-center gap-2 hover:bg-surface-variant transition-colors" onclick="selectCategory('${c.id}')">
                <span class="material-symbols-outlined">${icon}</span> ${c.name}
            </button>
            `;
        });

        chipsContainer.innerHTML = html;
        renderProducts();
    }

    function selectCategory(catId) {
        activeCategory = catId;
        
        // update chips styling
        const buttons = document.querySelectorAll(".cat-btn");
        buttons.forEach((btn, idx) => {
            const isTarget = (catId === "All" && idx === 0) || (catId !== "All" && btn.getAttribute("onclick").includes(catId));
            if (isTarget) {
                btn.className = "cat-btn whitespace-nowrap px-lg py-sm bg-primary-container text-on-primary-container rounded-xl font-title-md flex items-center gap-2";
            } else {
                btn.className = "cat-btn whitespace-nowrap px-lg py-sm bg-surface-container-low border border-outline-variant text-on-surface-variant rounded-xl font-title-md flex items-center gap-2 hover:bg-surface-variant transition-colors";
            }
        });

        renderProducts();
    }

    function renderProducts() {
        const grid = document.getElementById("product-grid");
        grid.innerHTML = "";

        let products = window.db.getProducts();

        // Category filter
        if (activeCategory !== "All") {
            products = products.filter(p => p.categoryId === activeCategory);
        }

        // Search filter
        const query = document.getElementById("product-search").value.toLowerCase().trim();
        if (query) {
            products = products.filter(p => p.name.toLowerCase().includes(query));
        }

        products.forEach(p => {
            const img = p.image || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200&auto=format&fit=crop&q=60";
            const priceStr = new Intl.NumberFormat('uz-UZ').format(p.price) + " UZS";

            grid.innerHTML += `
            <div class="bg-surface-container-low rounded-2xl overflow-hidden shadow-sm hover:shadow-md hover:-translate-y-1 transition-all active:scale-95 cursor-pointer border border-surface-container-high group" onclick="addToCart('${p.id}')">
                <div class="h-28 w-full overflow-hidden bg-surface-container relative">
                    <img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" src="${img}" alt="${p.name}">
                    <span class="absolute bottom-1 right-1 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded font-bold">Omborda: ${p.stock} ${p.unit}</span>
                </div>
                <div class="p-md">
                    <h3 class="font-title-md text-on-surface leading-tight mb-1 font-semibold">${p.name}</h3>
                    <div class="font-title-md text-primary font-bold">${priceStr}</div>
                </div>
            </div>
            `;
        });
    }

    function filterProducts() {
        renderProducts();
    }

    // 3. Cart Logic
    function renderCart() {
        const cartContainer = document.getElementById("cart-items");
        cartContainer.innerHTML = "";

        if (!currentOrder || currentOrder.items.length === 0) {
            cartContainer.innerHTML = `
            <div class="h-full flex flex-col items-center justify-center text-on-surface-variant/40 py-xl">
                <span class="material-symbols-outlined text-[64px] mb-md">shopping_basket</span>
                <p class="font-title-md font-medium">Savat bo'sh</p>
                <p class="text-xs mt-1">Stolga taomlar qo'shing</p>
            </div>
            `;
            updateCartSummary(0);
            document.getElementById("cart-customer-label").innerText = "Mijoz tanlanmagan";
            return;
        }

        // Customer Display
        if (currentOrder.customerId) {
            const customer = window.db.getCustomers().find(c => c.id === currentOrder.customerId);
            document.getElementById("cart-customer-label").innerText = customer ? customer.name : "Mijoz tanlangan";
        } else {
            document.getElementById("cart-customer-label").innerText = "Mehmon (Walk-in)";
        }

        let subtotal = 0;

        currentOrder.items.forEach(item => {
            const itemTotal = item.price * item.qty;
            subtotal += itemTotal;

            cartContainer.innerHTML += `
            <div class="flex flex-col gap-xs p-sm bg-surface-container-lowest rounded-xl border border-surface-container">
                <div class="flex justify-between items-start">
                    <span class="font-title-md font-semibold text-on-surface">${item.name}</span>
                    <span class="font-title-md font-bold text-on-surface">${new Intl.NumberFormat('uz-UZ').format(itemTotal)}</span>
                </div>
                <div class="flex items-center justify-between mt-xs">
                    <div class="flex items-center gap-md bg-surface-container-high rounded-lg px-xs border border-outline-variant/10">
                        <button class="w-8 h-8 flex items-center justify-center text-primary font-bold active:scale-90" onclick="changeQty('${item.id}', -1)"><span class="material-symbols-outlined">remove</span></button>
                        <span class="font-bold text-on-surface">${item.qty}</span>
                        <button class="w-8 h-8 flex items-center justify-center text-primary font-bold active:scale-90" onclick="changeQty('${item.id}', 1)"><span class="material-symbols-outlined">add</span></button>
                    </div>
                    <span class="text-on-surface-variant font-label-lg">${new Intl.NumberFormat('uz-UZ').format(item.price)} x ${item.qty}</span>
                </div>
            </div>
            `;
        });

        updateCartSummary(subtotal);
    }

    function addToCart(prodId) {
        const prod = window.db.getProducts().find(p => p.id === prodId);
        if (!prod) return;

        const cartItem = currentOrder.items.find(it => it.id === prodId);
        if (cartItem) {
            cartItem.qty += 1;
        } else {
            currentOrder.items.push({
                id: prod.id,
                name: prod.name,
                price: prod.price,
                qty: 1
            });
        }

        // Auto change table to Band in local state, and save order
        saveCurrentOrderState();
        renderCart();
    }

    function changeQty(prodId, delta) {
        const item = currentOrder.items.find(it => it.id === prodId);
        if (!item) return;

        if (delta < 0) {
            const user = window.db.getCurrentSession();
            if (user && user.role === "Ofitsiant") {
                const pin = prompt("Miqdorni kamaytirish uchun Admin PIN kodini kiriting:");
                const admins = window.db.getEmployees().filter(e => e.role === "Admin" || e.role === "Kassir");
                if (!admins.some(a => a.pin === pin)) {
                    alert("PIN kod xato! Amaliyot taqiqlandi.");
                    return;
                }
            }
        }

        item.qty += delta;
        if (item.qty <= 0) {
            currentOrder.items = currentOrder.items.filter(it => it.id !== prodId);
        }

        if (currentOrder.items.length === 0) {
            if (currentOrder.id) {
                window.db.deleteOrder(currentOrder.id);
                window.db.updateTableStatus(activeTableId, "Bo'sh", null);
                currentOrder.id = null;
            }
            renderTables();
        } else {
            saveCurrentOrderState();
        }
        
        renderCart();
    }

    function clearCart() {
        const user = window.db.getCurrentSession();
        if (user && user.role === "Ofitsiant") {
            const pin = prompt("Savatni tozalash uchun Admin PIN kodini kiriting:");
            const admins = window.db.getEmployees().filter(e => e.role === "Admin" || e.role === "Kassir");
            if (!admins.some(a => a.pin === pin)) {
                alert("PIN kod xato! Amaliyot taqiqlandi.");
                return;
            }
        }

        if (confirm("Haqiqatan ham savatni tozalamoqchimisiz?")) {
            currentOrder.items = [];
            currentOrder.customerId = null;
            
            // Delete order from database and mark table free
            if (currentOrder.id) {
                window.db.deleteOrder(currentOrder.id);
                window.db.updateTableStatus(activeTableId, "Bo'sh", null);
                currentOrder.id = null;
            }
            
            selectTable(activeTableId);
        }
    }

    function saveCurrentOrderState() {
        if (currentOrder.items.length === 0) return;

        const settings = window.db.getSettings();
        const servicePct = settings.serviceCharge || 10;
        const taxPct = settings.taxRate || 12;

        let subtotal = currentOrder.items.reduce((sum, item) => sum + (item.price * item.qty), 0);
        let service = Math.round(subtotal * (servicePct / 100));
        let tax = Math.round(subtotal * (taxPct / 100));
        let total = subtotal + service + tax;

        currentOrder.amount = total;

        // Save order to database
        const savedOrder = window.db.saveOrder(currentOrder);
        currentOrder.id = savedOrder.id;

        // Set table as Occupied
        window.db.updateTableStatus(activeTableId, "Band", currentOrder.id);
        renderTables();
    }

    function updateCartSummary(subtotal) {
        const settings = window.db.getSettings();
        const servicePct = settings.serviceCharge || 10;
        const taxPct = settings.taxRate || 12;

        let service = Math.round(subtotal * (servicePct / 100));
        let tax = Math.round(subtotal * (taxPct / 100));
        let total = subtotal + service + tax;

        document.getElementById("cart-subtotal").innerText = new Intl.NumberFormat('uz-UZ').format(subtotal) + " UZS";
        document.getElementById("cart-service").innerText = new Intl.NumberFormat('uz-UZ').format(service) + " UZS (" + servicePct + "%)";
        document.getElementById("cart-tax").innerText = new Intl.NumberFormat('uz-UZ').format(tax) + " UZS (" + taxPct + "%)";
        document.getElementById("cart-total").innerText = new Intl.NumberFormat('uz-UZ').format(total) + " UZS";
    }

    // 4. Checkout Navigation
    function proceedToCheckout() {
        if (!currentOrder || currentOrder.items.length === 0) {
            alert("To'lovga o'tish uchun savatga taomlar qo'shing!");
            return;
        }

        // Save state one last time
        saveCurrentOrderState();

        // Storing active checkout order in session storage or local storage
        localStorage.setItem("safranbonu_checkout_order_id", currentOrder.id);
        window.location.href = "checkout.html";
    }

    // 5. Customer Selection Modal Functions
    function openCustomerModal() {
        document.getElementById("customer-modal").classList.remove("hidden");
        document.getElementById("customer-search-input").value = "";
        filterModalCustomers();
    }

    function closeCustomerModal() {
        document.getElementById("customer-modal").classList.add("hidden");
    }

    function filterModalCustomers() {
        const query = document.getElementById("customer-search-input").value.toLowerCase().trim();
        const customers = window.db.getCustomers();
        const filtered = customers.filter(c => c.name.toLowerCase().includes(query) || c.phone.includes(query));

        const listContainer = document.getElementById("modal-customer-list");
        listContainer.innerHTML = "";

        if (filtered.length === 0) {
            listContainer.innerHTML = `<p class="text-body-md text-on-surface-variant text-center py-lg">Mijoz topilmadi</p>`;
            return;
        }

        filtered.forEach(c => {
            listContainer.innerHTML += `
            <div class="p-sm bg-surface-container-low hover:bg-primary/10 rounded-xl flex justify-between items-center cursor-pointer transition-all border border-outline-variant/10"
                 onclick="selectCustomer('${c.id}')">
                <div>
                    <p class="font-title-md font-bold text-on-surface">${c.name}</p>
                    <p class="font-label-md text-on-surface-variant">${c.phone}</p>
                </div>
                <div class="text-right">
                    <span class="px-md py-0.5 bg-primary-fixed text-primary font-bold text-label-md rounded-full">${c.points} ball</span>
                </div>
            </div>
            `;
        });
    }

    function selectCustomer(customerId) {
        currentOrder.customerId = customerId;
        saveCurrentOrderState();
        renderCart();
        closeCustomerModal();
    }

    function selectWalkInCustomer() {
        currentOrder.customerId = null;
        saveCurrentOrderState();
        renderCart();
        closeCustomerModal();
    }

    function quickAddCustomerPrompt() {
        const name = prompt("Mijoz ismi va familiyasi:");
        if (!name) return;
        const phone = prompt("Mijoz telefon raqami (masalan, +998901234567):");
        if (!phone) return;

        const newCust = window.db.saveCustomer({ name, phone });
        selectCustomer(newCust.id);
    }
</script>
</body></html>
