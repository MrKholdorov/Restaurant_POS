<body class="overflow-hidden">

<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 modal-blur-bg px-margin">
    <div class="bg-surface rounded-3xl shadow-2xl w-full max-w-5xl flex h-[870px] overflow-hidden">
        <!-- Left Side: Order Summary -->
        <div class="w-[350px] bg-surface-container-low border-r border-outline-variant flex flex-col">
            <div class="p-lg border-b border-outline-variant flex justify-between items-center">
                <div>
                    <h2 class="font-headline-md text-headline-md text-on-surface">To'lov</h2>
                    <p class="text-on-surface-variant font-label-lg" id="checkout-order-title">Buyurtma #...</p>
                </div>
                <a href="pos.html" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-variant transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </a>
            </div>
            
            <!-- Items scroll list -->
            <div class="flex-1 overflow-y-auto p-lg space-y-lg" id="checkout-items-list">
                <!-- Loaded dynamically -->
            </div>
            
            <div class="p-lg border-t border-outline-variant bg-surface-container-highest space-y-sm">
                <div class="flex justify-between text-on-surface-variant font-body-md">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">0 UZS</span>
                </div>
                <div class="flex justify-between text-on-surface-variant font-body-md">
                    <span>Xizmat haqi</span>
                    <span id="checkout-service">0 UZS</span>
                </div>
                <div class="flex justify-between text-on-surface-variant font-body-md">
                    <span>QQS (Tax)</span>
                    <span id="checkout-tax">0 UZS</span>
                </div>
                <div class="flex flex-col items-end pt-md border-t border-outline-variant/30">
                    <span class="font-label-lg text-primary uppercase tracking-wider">Umumiy Summa</span>
                    <span class="font-display-lg text-display-lg text-primary leading-none" id="checkout-total-val">0</span>
                    <span class="font-title-md text-primary mt-1">UZS</span>
                </div>
                
                <div class="flex justify-between items-center bg-surface-container-lowest p-md rounded-xl mt-md">
                    <span class="font-label-lg text-on-surface">Chek chop etish</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input id="print-receipt-toggle" checked="" class="sr-only peer" type="checkbox">
                        <div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                    </label>
                </div>
            </div>
        </div>
        
        <!-- Right Side: Payment Interaction -->
        <div class="flex-1 flex flex-col bg-surface">
            <!-- Payment Method Selection -->
            <div class="p-lg">
                <span class="font-label-lg text-on-surface-variant block mb-md">To'lov turini tanlang</span>
                <div class="grid grid-cols-4 gap-md">
                    <button id="pay-cash" class="active-payment-pill flex flex-col items-center justify-center p-lg rounded-2xl gap-xs transition-all hover:shadow-md cursor-pointer" onclick="selectPaymentMethod('Naqd')">
                        <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">payments</span>
                        <span class="font-label-lg text-primary">Naqd</span>
                    </button>
                    <button id="pay-card" class="bg-surface-container-high flex flex-col items-center justify-center p-lg rounded-2xl gap-xs transition-all hover:bg-outline-variant cursor-pointer" onclick="selectPaymentMethod('Karta')">
                        <span class="material-symbols-outlined text-on-surface-variant">credit_card</span>
                        <span class="font-label-lg text-on-surface-variant">Plastik</span>
                    </button>
                    <button id="pay-click" class="bg-surface-container-high flex flex-col items-center justify-center p-lg rounded-2xl gap-xs transition-all hover:bg-outline-variant cursor-pointer" onclick="selectPaymentMethod('Click')">
                        <span class="material-symbols-outlined text-on-surface-variant">qr_code_2</span>
                        <span class="font-label-lg text-on-surface-variant">Click</span>
                    </button>
                    <button id="pay-payme" class="bg-surface-container-high flex flex-col items-center justify-center p-lg rounded-2xl gap-xs transition-all hover:bg-outline-variant cursor-pointer" onclick="selectPaymentMethod('Payme')">
                        <span class="material-symbols-outlined text-on-surface-variant">touch_app</span>
                        <span class="font-label-lg text-on-surface-variant">Payme</span>
                    </button>
                </div>
            </div>
            
            <!-- Numeric Keypad & Amount -->
            <div class="flex-1 px-lg pb-lg flex gap-lg overflow-hidden">
                <!-- Keypad Column -->
                <div class="flex-1 flex flex-col">
                    <div class="mb-md">
                        <span class="font-label-lg text-on-surface-variant block mb-xs">Qabul qilingan summa</span>
                        <div class="bg-surface-container-low p-lg rounded-2xl border-2 border-outline-variant flex justify-between items-center group focus-within:border-primary">
                            <span class="font-display-lg text-display-lg text-on-surface tracking-tight" id="amount-display">0</span>
                            <span class="font-title-lg text-on-surface-variant">UZS</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-sm flex-1">
                        <button class="num-pad-btn bg-surface-container rounded-xl font-headline-md text-on-surface flex items-center justify-center" onclick="pressNum(1)">1</button>
                        <button class="num-pad-btn bg-surface-container rounded-xl font-headline-md text-on-surface flex items-center justify-center" onclick="pressNum(2)">2</button>
                        <button class="num-pad-btn bg-surface-container rounded-xl font-headline-md text-on-surface flex items-center justify-center" onclick="pressNum(3)">3</button>
                        <button class="num-pad-btn bg-surface-container rounded-xl font-headline-md text-on-surface flex items-center justify-center" onclick="pressNum(4)">4</button>
                        <button class="num-pad-btn bg-surface-container rounded-xl font-headline-md text-on-surface flex items-center justify-center" onclick="pressNum(5)">5</button>
                        <button class="num-pad-btn bg-surface-container rounded-xl font-headline-md text-on-surface flex items-center justify-center" onclick="pressNum(6)">6</button>
                        <button class="num-pad-btn bg-surface-container rounded-xl font-headline-md text-on-surface flex items-center justify-center" onclick="pressNum(7)">7</button>
                        <button class="num-pad-btn bg-surface-container rounded-xl font-headline-md text-on-surface flex items-center justify-center" onclick="pressNum(8)">8</button>
                        <button class="num-pad-btn bg-surface-container rounded-xl font-headline-md text-on-surface flex items-center justify-center" onclick="pressNum(9)">9</button>
                        <button class="num-pad-btn bg-surface-container rounded-xl font-headline-md text-on-surface flex items-center justify-center" onclick="pressNum('000')">000</button>
                        <button class="num-pad-btn bg-surface-container rounded-xl font-headline-md text-on-surface flex items-center justify-center" onclick="pressNum(0)">0</button>
                        <button class="num-pad-btn bg-error-container text-on-error-container rounded-xl font-headline-md flex items-center justify-center" onclick="pressNum('back')">
                            <span class="material-symbols-outlined">backspace</span>
                        </button>
                    </div>
                </div>
                
                <!-- Denominations & Change Column -->
                <div class="w-48 flex flex-col gap-md">
                    <div class="flex-1 flex flex-col gap-sm" id="quick-cash-buttons">
                        <span class="font-label-lg text-on-surface-variant block">Tezkor tanlash</span>
                        <!-- Loaded dynamically based on Grand Total -->
                    </div>
                    
                    <div class="bg-secondary-container/10 p-md rounded-2xl border border-secondary-container/30" id="change-box">
                        <span class="font-label-lg text-secondary block mb-xs">Qaytim</span>
                        <div class="text-headline-md font-bold text-secondary" id="change-display">0</div>
                        <span class="font-label-md text-secondary/70">UZS</span>
                    </div>
                    
                    <button class="bg-primary text-white py-lg rounded-2xl font-title-lg font-bold shadow-lg hover:shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-md cursor-pointer" onclick="completePayment()">
                        <span>To'lovni yakunlash</span>
                        <span class="material-symbols-outlined">check_circle</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Receipt Modal Simulator -->
<div id="receipt-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden backdrop-blur-sm">
    <div class="bg-white p-lg rounded-2xl max-w-sm w-full flex flex-col shadow-2xl border border-outline-variant font-mono text-sm leading-tight max-h-[90vh]">
        <div class="flex justify-between items-center pb-sm border-b border-black border-dashed mb-md">
            <span class="font-bold text-lg">Safranbonu POS</span>
            <span class="text-xs" id="receipt-date">01.07.2026</span>
        </div>
        <div class="text-center font-bold text-md mb-md">KVITANSIYA / RECEIPT</div>
        <div class="space-y-xs pb-md border-b border-black border-dashed mb-md" id="receipt-header">
            <!-- Header detail -->
        </div>
        <div class="flex-1 overflow-y-auto mb-md" id="receipt-items">
            <!-- Loaded dynamically -->
        </div>
        <div class="space-y-xs pt-md border-t border-black border-dashed font-bold text-right" id="receipt-totals">
            <!-- Loaded dynamically -->
        </div>
        <div class="text-center text-xs mt-lg pt-md border-t border-black border-dashed">
            Xizmatingizdan mamnunmiz!<br>Tashrifingiz uchun rahmat!
        </div>
        <button class="mt-xl w-full bg-primary text-white py-sm rounded-xl font-bold font-sans" onclick="closeReceiptAndReturn()">Yopish</button>
    </div>
</div>

<script src="db.js"></script>
<script>
    let orderId = "";
    let order = null;
    let paymentMethod = "Naqd";
    let receivedAmount = 0;
    let grandTotal = 0;

    document.addEventListener("DOMContentLoaded", () => {
        orderId = localStorage.getItem("safranbonu_checkout_order_id");
        if (!orderId) {
            alert("Sotuv buyurtmasi topilmadi!");
            window.location.href = "pos.html";
            return;
        }

        order = window.db.getOrders().find(o => o.id === orderId);
        if (!order) {
            alert("Sotuv buyurtmasi ma'lumotlar bazasida topilmadi!");
            window.location.href = "pos.html";
            return;
        }

        grandTotal = order.amount;
        receivedAmount = 0;

        document.getElementById("checkout-order-title").innerText = `Buyurtma #${order.id.split('-')[1] || order.id}`;
        
        loadOrderDetails();
        selectPaymentMethod("Naqd");
    });

    function loadOrderDetails() {
        // Render Summary list
        const list = document.getElementById("checkout-items-list");
        list.innerHTML = "";

        let subtotal = 0;
        order.items.forEach(item => {
            const itemTotal = item.price * item.qty;
            subtotal += itemTotal;

            list.innerHTML += `
            <div class="flex justify-between items-start text-on-surface">
                <div class="flex flex-col">
                    <span class="font-title-md font-semibold">${item.name}</span>
                    <span class="text-on-surface-variant font-label-md">${item.qty} dona x ${new Intl.NumberFormat('uz-UZ').format(item.price)}</span>
                </div>
                <span class="font-title-md font-semibold">${new Intl.NumberFormat('uz-UZ').format(itemTotal)}</span>
            </div>
            `;
        });

        const settings = window.db.getSettings();
        const servicePct = settings.serviceCharge || 10;
        const taxPct = settings.taxRate || 12;

        let service = Math.round(subtotal * (servicePct / 100));
        let tax = Math.round(subtotal * (taxPct / 100));

        document.getElementById("checkout-subtotal").innerText = new Intl.NumberFormat('uz-UZ').format(subtotal) + " UZS";
        document.getElementById("checkout-service").innerText = new Intl.NumberFormat('uz-UZ').format(service) + " UZS (" + servicePct + "%)";
        document.getElementById("checkout-tax").innerText = new Intl.NumberFormat('uz-UZ').format(tax) + " UZS (" + taxPct + "%)";
        document.getElementById("checkout-total-val").innerText = new Intl.NumberFormat('uz-UZ').format(grandTotal);

        // Load Tezkor tanlash (quick cash)
        const quickContainer = document.getElementById("quick-cash-buttons");
        quickContainer.innerHTML = `<span class="font-label-lg text-on-surface-variant block">Tezkor tanlash</span>`;

        const roundedList = generateQuickCashDenominations(grandTotal);
        roundedList.forEach(amt => {
            quickContainer.innerHTML += `
            <button class="bg-surface-container-high py-md rounded-xl font-title-md hover:bg-outline-variant transition-colors" onclick="setReceivedAmount(${amt})">${new Intl.NumberFormat('uz-UZ').format(amt)}</button>
            `;
        });
    }

    function generateQuickCashDenominations(total) {
        // Generate nice cash targets: exact total, or next 5000, 10000, 50000, 100000
        const denoms = new Set();
        denoms.add(total);

        // helper to round up to nearest multiple
        const roundUp = (val, mult) => Math.ceil(val / mult) * mult;
        
        denoms.add(roundUp(total, 5000));
        denoms.add(roundUp(total, 10000));
        denoms.add(roundUp(total, 50000));
        denoms.add(roundUp(total, 100000));

        // convert to sorted array
        return Array.from(denoms).sort((a,b)=>a-b).slice(0, 4);
    }

    function selectPaymentMethod(method) {
        paymentMethod = method;

        // Visual select state update
        const btns = {
            "Naqd": document.getElementById("pay-cash"),
            "Karta": document.getElementById("pay-card"),
            "Click": document.getElementById("pay-click"),
            "Payme": document.getElementById("pay-payme")
        };

        Object.keys(btns).forEach(m => {
            const btn = btns[m];
            if (m === method) {
                btn.className = "active-payment-pill flex flex-col items-center justify-center p-lg rounded-2xl gap-xs transition-all hover:shadow-md cursor-pointer";
                btn.querySelector("span").className = "material-symbols-outlined text-primary";
                btn.querySelector("span").style.variationSettings = "'FILL' 1";
                btn.querySelector("span+span").className = "font-label-lg text-primary";
            } else {
                btn.className = "bg-surface-container-high flex flex-col items-center justify-center p-lg rounded-2xl gap-xs transition-all hover:bg-outline-variant cursor-pointer";
                btn.querySelector("span").className = "material-symbols-outlined text-on-surface-variant";
                btn.querySelector("span").style.variationSettings = "";
                btn.querySelector("span+span").className = "font-label-lg text-on-surface-variant";
            }
        });

        // Numeric Keypad behaviour for non-cash modes
        if (method !== "Naqd") {
            setReceivedAmount(grandTotal);
            document.getElementById("change-box").style.opacity = "0.3";
        } else {
            setReceivedAmount(0);
            document.getElementById("change-box").style.opacity = "1";
        }
    }

    function pressNum(val) {
        if (paymentMethod !== "Naqd") return; // cannot type for card/electronic payment

        let str = receivedAmount.toString();
        if (str === "0") str = "";

        if (val === 'back') {
            str = str.slice(0, -1);
            if (str === "") str = "0";
        } else {
            str += val;
        }

        // cap length
        if (str.length > 12) return;

        setReceivedAmount(parseInt(str) || 0);
    }

    function setReceivedAmount(amt) {
        receivedAmount = amt;
        document.getElementById("amount-display").innerText = new Intl.NumberFormat('uz-UZ').format(receivedAmount);
        
        let change = Math.max(0, receivedAmount - grandTotal);
        document.getElementById("change-display").innerText = new Intl.NumberFormat('uz-UZ').format(change);
    }

    function completePayment() {
        if (paymentMethod === "Naqd" && receivedAmount < grandTotal) {
            alert("Qabul qilingan summa buyurtma jami summasidan kam bo'lmasligi kerak!");
            return;
        }

        // Process payment
        order.status = "Yakunlandi";
        order.paymentMethod = paymentMethod;
        window.db.saveOrder(order);

        // Release Table
        window.db.updateTableStatus(order.tableId, "Bo'sh", null);

        // Add Loyalty Points if customer exists
        if (order.customerId) {
            const customers = window.db.getCustomers();
            const idx = customers.findIndex(c => c.id === order.customerId);
            if (idx !== -1) {
                // Add 5% of order subtotal as points
                const ptsEarned = Math.round(order.amount * 0.05);
                customers[idx].points += ptsEarned;
                customers[idx].totalSpent += order.amount;
                customers[idx].visitCount += 1;
                customers[idx].lastVisit = new Date().toISOString().split('T')[0];
                localStorage.setItem("safranbonu_customers", JSON.stringify(customers));
            }
        }

        // Check if print receipt is toggled
        const shouldPrint = document.getElementById("print-receipt-toggle").checked;
        if (shouldPrint) {
            showReceiptModal();
        } else {
            alert("To'lov muvaffaqiyatli qabul qilindi!");
            window.location.href = "pos.html";
        }
    }

    // Receipt Modal Simulator
    function showReceiptModal() {
        const modal = document.getElementById("receipt-modal");
        modal.classList.remove("hidden");

        const settings = window.db.getSettings();

        document.getElementById("receipt-date").innerText = new Date().toLocaleString();

        const customer = order.customerId ? window.db.getCustomers().find(c => c.id === order.customerId) : null;
        const customerName = customer ? customer.name : "Mehmon";

        document.getElementById("receipt-header").innerHTML = `
        <div>Kassa: Safranbonu POS</div>
        <div>Stol: ${order.tableId || "Olib ketish"}</div>
        <div>Mijoz: ${customerName}</div>
        <div>Buyurtma ID: ${order.id.toUpperCase()}</div>
        `;

        const itemsContainer = document.getElementById("receipt-items");
        itemsContainer.innerHTML = "";
        let subtotal = 0;

        order.items.forEach(it => {
            const totalItem = it.price * it.qty;
            subtotal += totalItem;

            itemsContainer.innerHTML += `
            <div class="flex justify-between">
                <span>${it.name} x${it.qty}</span>
                <span>${new Intl.NumberFormat('uz-UZ').format(totalItem)}</span>
            </div>
            `;
        });

        const servicePct = settings.serviceCharge || 10;
        const taxPct = settings.taxRate || 12;

        let service = Math.round(subtotal * (servicePct / 100));
        let tax = Math.round(subtotal * (taxPct / 100));
        let change = Math.max(0, receivedAmount - grandTotal);

        document.getElementById("receipt-totals").innerHTML = `
        <div class="flex justify-between">
            <span>Subtotal:</span>
            <span>${new Intl.NumberFormat('uz-UZ').format(subtotal)} UZS</span>
        </div>
        <div class="flex justify-between">
            <span>Xizmat (${servicePct}%):</span>
            <span>${new Intl.NumberFormat('uz-UZ').format(service)} UZS</span>
        </div>
        <div class="flex justify-between">
            <span>QQS (${taxPct}%):</span>
            <span>${new Intl.NumberFormat('uz-UZ').format(tax)} UZS</span>
        </div>
        <div class="flex justify-between text-md font-black pt-xs border-t border-black border-dotted">
            <span>Jami:</span>
            <span>${new Intl.NumberFormat('uz-UZ').format(grandTotal)} UZS</span>
        </div>
        <div class="flex justify-between pt-xs text-xs font-normal">
            <span>To'lov usuli:</span>
            <span>${paymentMethod}</span>
        </div>
        <div class="flex justify-between text-xs font-normal">
            <span>Qabul qilindi:</span>
            <span>${new Intl.NumberFormat('uz-UZ').format(receivedAmount || grandTotal)} UZS</span>
        </div>
        <div class="flex justify-between text-xs font-normal">
            <span>Qaytim:</span>
            <span>${new Intl.NumberFormat('uz-UZ').format(change)} UZS</span>
        </div>
        `;
    }

    function closeReceiptAndReturn() {
        document.getElementById("receipt-modal").classList.add("hidden");
        window.location.href = "pos.html";
    }
</script>
