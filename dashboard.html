<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safranbonu POS - Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#994700",
                        "primary-container": "#ff7a00",
                        "surface": "#fcf9f8",
                        "surface-variant": "#e5e2e1",
                        "background": "#fcf9f8",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "on-surface": "#1b1b1c"
                    },
                    spacing: {
                        xs: "4px",
                        sm: "12px",
                        md: "16px",
                        lg: "24px",
                        xl: "32px",
                        gutter: "20px"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    fontFamily: {
                        headline: ["Inter"],
                        body: ["Inter"],
                        label: ["Inter"],
                        title: ["Inter"]
                    },
                    fontSize: {
                        "headline-lg": ["32px", {"lineHeight":"40px","fontWeight":"600"}],
                        "headline-md": ["24px", {"lineHeight":"32px","fontWeight":"600"}],
                        "title-lg": ["20px", {"lineHeight":"28px","fontWeight":"500"}],
                        "title-md": ["16px", {"lineHeight":"24px","fontWeight":"500"}],
                        "body-lg": ["16px", {"lineHeight":"24px","fontWeight":"400"}],
                        "body-md": ["14px", {"lineHeight":"20px","fontWeight":"400"}],
                        "label-lg": ["12px", {"lineHeight":"16px","letterSpacing":"0.5px","fontWeight":"600"}],
                        "label-md": ["11px", {"lineHeight":"16px","fontWeight":"500"}]
                    }
                }
            }
        };
    </script>
    <style>
        body {font-family: 'Inter', sans-serif; background-color: #fcf9f8; overflow-x: hidden;}
        .glass-card {background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.5);}
        .bg-pattern {background-image: radial-gradient(circle at 2px 2px, #e0c0af 1px, transparent 0); background-size: 40px 40px; opacity:0.2;}
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative">
    <!-- Background pattern -->
    <div class="absolute inset-0 z-0 overflow-hidden">
        <div class="absolute inset-0 bg-pattern"></div>
        <div class="absolute -top-1/4 -left-1/4 w-1/2 h-1/2 bg-primary-fixed opacity-30 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-1/4 -right-1/4 w-1/2 h-1/2 bg-secondary-fixed opacity-20 rounded-full blur-[120px]"></div>
    </div>

    <main class="relative z-10 w-full max-w-5xl px-md py-lg">
        <!-- Header injected by shared.js -->
        <header></header>
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-lg mt-lg">
            <div class="glass-card p-lg rounded-xl shadow-lg">
                <h2 class="font-headline-md text-headline-md text-primary mb-sm">Bugungi tushum</h2>
                <p id="today-revenue" class="font-title-lg text-title-lg font-bold text-primary"></p>
                <div class="w-full bg-surface-container-high h-1.5 rounded-full mt-sm overflow-hidden">
                    <div id="revenue-bar" class="bg-primary-container h-full rounded-full" style="width:0%"></div>
                </div>
            </div>
            <div class="glass-card p-lg rounded-xl shadow-lg">
                <h2 class="font-headline-md text-headline-md text-primary mb-sm">Bugungi buyurtmalar</h2>
                <p id="today-orders" class="font-title-lg text-title-lg font-bold text-primary"></p>
            </div>
            <div class="glass-card p-lg rounded-xl shadow-lg flex flex-col items-center">
                <h2 class="font-headline-md text-headline-md text-primary mb-sm">Oylik savdo trendi</h2>
                <canvas id="sales-chart" class="w-full h-48"></canvas>
            </div>
        </section>
    </main>

    <script src="shared.js"></script>
    <script>
        const format = (v)=> new Intl.NumberFormat('uz-UZ').format(v)+' UZS';
        const today = new Date().toISOString().split('T')[0];
        const orders = window.db.getOrders();
        const todayOrders = orders.filter(o=> o.date===today && o.status==='Yakunlandi');
        const todayRevenue = todayOrders.reduce((s,o)=>s+o.amount,0);
        document.getElementById('today-revenue').innerText = format(todayRevenue);
        document.getElementById('revenue-bar').style.width = Math.min(100,(todayRevenue/15000000)*100)+'%';
        document.getElementById('today-orders').innerText = todayOrders.length;
        // chart for last 7 days
        const ctx = document.getElementById('sales-chart').getContext('2d');
        const labels = [];
        const data = [];
        for(let i=6;i>=0;i--){
            const d = new Date();
            d.setDate(d.getDate()-i);
            labels.push(d.toLocaleDateString('uz-UZ',{month:'short',day:'numeric'}));
            const dayOrders = orders.filter(o=> o.date===d.toISOString().split('T')[0] && o.status==='Yakunlandi');
            data.push(dayOrders.reduce((s,o)=>s+o.amount,0));
        }
        new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'Daromad',data,borderColor:'#994700',backgroundColor:'rgba(153,71,0,0.2)',tension:0.4,fill:true}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
    </script>
</body>
</html>
