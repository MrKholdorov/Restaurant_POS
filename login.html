<!DOCTYPE html><html lang="uz"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Safranbonu POS - Kirish</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="tailwind-config.js"></script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf9f8;
            overflow: hidden;
        }

        .bg-pattern {
            background-image: radial-gradient(circle at 2px 2px, #334155 1px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.2;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .tab-content {
            transition: all 0.3s ease-in-out;
        }
        
        .active-tab-indicator {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
    <link rel="stylesheet" href="premium.css">
</head>
<body class="flex items-center justify-center min-h-screen relative">
<!-- Abstract Atmospheric Background -->
<div class="absolute inset-0 z-0 overflow-hidden">
<div class="absolute inset-0 bg-pattern"></div>
<div class="absolute -top-1/4 -left-1/4 w-1/2 h-1/2 bg-primary-fixed opacity-30 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-1/4 -right-1/4 w-1/2 h-1/2 bg-secondary-fixed opacity-20 rounded-full blur-[120px]"></div>
</div>

<!-- Main Container -->
<main class="relative z-10 w-full max-w-[440px] px-md">
<!-- Login Card -->
<div class="glass-card shadow-2xl rounded-2xl overflow-hidden p-xl flex flex-col items-center">
<!-- Branding Section -->
<div class="mb-xl flex flex-col items-center space-y-md w-full">
<div class="w-20 h-20 rounded-2xl bg-primary-container shadow-sm flex items-center justify-center text-white">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div class="text-center">
<h1 class="font-headline-md text-headline-md text-on-surface font-bold text-primary">Safranbonu POS</h1>
<p class="font-label-lg text-label-lg text-on-surface-variant tracking-wider uppercase">Premium Boshqaruv Tizimi</p>
</div>
</div>

<!-- Error Display -->
<div id="error-alert" class="w-full bg-error-container text-on-error-container p-md rounded-xl mb-md hidden flex items-center gap-sm">
    <span class="material-symbols-outlined">error</span>
    <span class="text-body-md font-medium" id="error-message">Foydalanuvchi nomi yoki parol xato!</span>
</div>

<!-- Login Method Tabs -->
<div class="w-full flex bg-surface-container-low rounded-xl p-xs mb-lg relative">
<div class="active-tab-indicator absolute h-[calc(100%-8px)] w-[calc(50%-4px)] bg-surface-container-lowest shadow-sm rounded-lg top-1 left-1" id="tab-indicator"></div>
<button class="flex-1 relative z-10 py-sm font-title-md text-title-md text-on-surface transition-colors" id="btn-email" onclick="switchTab('email')">
                    Login
                </button>
<button class="flex-1 relative z-10 py-sm font-title-md text-title-md text-on-surface-variant transition-colors" id="btn-pin" onclick="switchTab('pin')">
                    PIN Kod
                </button>
</div>

<!-- Email Form -->
<form class="w-full space-y-lg block" id="email-form">
<div class="space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-md" for="username">Foydalanuvchi nomi</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">person</span>
<input class="w-full bg-surface-container-low border-none rounded-xl py-lg pl-xl pr-md text-body-lg font-body-lg focus:ring-2 focus:ring-primary transition-all placeholder:text-outline" id="username" placeholder="admin yoki waiter" required="" type="text">
</div>
</div>
<div class="space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-md" for="password">Parol</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-low border-none rounded-xl py-lg pl-xl pr-md text-body-lg font-body-lg focus:ring-2 focus:ring-primary transition-all placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button" onclick="togglePasswordVisibility()">
<span class="material-symbols-outlined" id="password-eye">visibility</span>
</button>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-lg rounded-xl shadow-lg hover:shadow-primary-container/20 hover:brightness-110 active:scale-[0.98] transition-all" type="submit">
                    Kirish
                </button>
</form>

<!-- PIN Form (Hidden by default) -->
<div class="w-full hidden flex flex-col items-center" id="pin-form">
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-lg">O'zingizning 4 xonali PIN kodingizni kiriting</p>
<div class="flex gap-md mb-xl">
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-surface-container-low" id="dot-1"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-surface-container-low" id="dot-2"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-surface-container-low" id="dot-3"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-surface-container-low" id="dot-4"></div>
</div>
<!-- Number Pad -->
<div class="grid grid-cols-3 gap-md w-full max-w-[300px]">
<button class="aspect-square flex items-center justify-center bg-surface-container hover:bg-surface-container-high rounded-full font-headline-md text-headline-md text-on-surface transition-colors active:scale-90" onclick="handlePin(1)">1</button>
<button class="aspect-square flex items-center justify-center bg-surface-container hover:bg-surface-container-high rounded-full font-headline-md text-headline-md text-on-surface transition-colors active:scale-90" onclick="handlePin(2)">2</button>
<button class="aspect-square flex items-center justify-center bg-surface-container hover:bg-surface-container-high rounded-full font-headline-md text-headline-md text-on-surface transition-colors active:scale-90" onclick="handlePin(3)">3</button>
<button class="aspect-square flex items-center justify-center bg-surface-container hover:bg-surface-container-high rounded-full font-headline-md text-headline-md text-on-surface transition-colors active:scale-90" onclick="handlePin(4)">4</button>
<button class="aspect-square flex items-center justify-center bg-surface-container hover:bg-surface-container-high rounded-full font-headline-md text-headline-md text-on-surface transition-colors active:scale-90" onclick="handlePin(5)">5</button>
<button class="aspect-square flex items-center justify-center bg-surface-container hover:bg-surface-container-high rounded-full font-headline-md text-headline-md text-on-surface transition-colors active:scale-90" onclick="handlePin(6)">6</button>
<button class="aspect-square flex items-center justify-center bg-surface-container hover:bg-surface-container-high rounded-full font-headline-md text-headline-md text-on-surface transition-colors active:scale-90" onclick="handlePin(7)">7</button>
<button class="aspect-square flex items-center justify-center bg-surface-container hover:bg-surface-container-high rounded-full font-headline-md text-headline-md text-on-surface transition-colors active:scale-90" onclick="handlePin(8)">8</button>
<button class="aspect-square flex items-center justify-center bg-surface-container hover:bg-surface-container-high rounded-full font-headline-md text-headline-md text-on-surface transition-colors active:scale-90" onclick="handlePin(9)">9</button>
<div class="aspect-square"></div>
<button class="aspect-square flex items-center justify-center bg-surface-container hover:bg-surface-container-high rounded-full font-headline-md text-headline-md text-on-surface transition-colors active:scale-90" onclick="handlePin(0)">0</button>
<button class="aspect-square flex items-center justify-center bg-surface-container hover:bg-surface-container-high rounded-full font-headline-md text-headline-md text-on-surface transition-colors active:scale-90" onclick="handlePin('back')">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
</div>
</div>
<!-- Footer Copyright -->
<p class="mt-lg text-center font-label-md text-label-md text-on-surface-variant/60">
            © 2026 Safranbonu POS. Barcha huquqlar himoyalangan.
        </p>
</main>

<script src="db.js"></script>
<script>
        let currentPin = "";
        let currentTab = "email";

        function switchTab(type) {
            currentTab = type;
            const indicator = document.getElementById('tab-indicator');
            const emailForm = document.getElementById('email-form');
            const pinForm = document.getElementById('pin-form');
            const btnEmail = document.getElementById('btn-email');
            const btnPin = document.getElementById('btn-pin');
            const errorAlert = document.getElementById('error-alert');
            errorAlert.classList.add('hidden');

            if (type === 'email') {
                indicator.style.transform = 'translateX(0)';
                emailForm.classList.remove('hidden');
                pinForm.classList.add('hidden');
                btnEmail.classList.add('text-on-surface');
                btnEmail.classList.remove('text-on-surface-variant');
                btnPin.classList.remove('text-on-surface');
                btnPin.classList.add('text-on-surface-variant');
            } else {
                indicator.style.transform = 'translateX(100%)';
                emailForm.classList.add('hidden');
                pinForm.classList.remove('hidden');
                btnEmail.classList.remove('text-on-surface');
                btnEmail.classList.add('text-on-surface-variant');
                btnPin.classList.add('text-on-surface');
                btnPin.classList.remove('text-on-surface-variant');
                currentPin = "";
                updatePinDots();
            }
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const passEye = document.getElementById('password-eye');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passEye.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                passEye.innerText = 'visibility';
            }
        }

        function showError(msg) {
            const errorAlert = document.getElementById('error-alert');
            const errorMsg = document.getElementById('error-message');
            errorMsg.innerText = msg;
            errorAlert.classList.remove('hidden');
        }

        function redirectUser(user) {
            if (user.role === "Ofitsiant") {
                window.location.href = "pos.html";
            } else {
                window.location.href = "index.html";
            }
        }

        function handlePin(val) {
            if (val === 'back') {
                currentPin = currentPin.slice(0, -1);
            } else if (currentPin.length < 4) {
                currentPin += val;
            }

            updatePinDots();

            if (currentPin.length === 4) {
                setTimeout(() => {
                    const employees = window.db.getEmployees();
                    const matchedUser = employees.find(e => e.pin === currentPin);
                    if (matchedUser) {
                        localStorage.setItem("safranbonu_session", JSON.stringify(matchedUser));
                        redirectUser(matchedUser);
                    } else {
                        showError("PIN Kod noto'g'ri kiritildi!");
                        currentPin = "";
                        updatePinDots();
                    }
                }, 300);
            }
        }

        function updatePinDots() {
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i <= currentPin.length) {
                    dot.classList.remove('bg-surface-container-low', 'border-outline-variant');
                    dot.classList.add('bg-primary', 'border-primary');
                } else {
                    dot.classList.add('bg-surface-container-low', 'border-outline-variant');
                    dot.classList.remove('bg-primary', 'border-primary');
                }
            }
        }

        // Email form submit
        document.getElementById('email-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            
            // Standardize username check
            const user = window.db.login(usernameInput, passwordInput);
            if (user) {
                redirectUser(user);
            } else {
                showError("Foydalanuvchi nomi yoki parol xato!");
            }
        });
        
        // If already logged in, redirect
        const sessionStr = localStorage.getItem("safranbonu_session");
        if (sessionStr) {
            try {
                const sessionUser = JSON.parse(sessionStr);
                redirectUser(sessionUser);
            } catch(e) {
                localStorage.removeItem("safranbonu_session");
            }
        }
    </script>
</body></html>
