<!DOCTYPE html>
<html lang='uz'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Safranbonu POS - Mijozlar Bazasi</title>
<script src='https://cdn.tailwindcss.com?plugins=forms,container-queries'></script>
<link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap' rel='stylesheet'>
<link href='https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap' rel='stylesheet'>
<style>
  .glass-panel {background: rgba(255,255,255,0.7);backdrop-filter: blur(12px);border:1px solid rgba(224,192,175,0.3);}
</style>
    <link rel="stylesheet" href="premium.css">
</head>
<body class='bg-surface font-body-md text-on-background overflow-hidden flex min-h-screen'>
<aside></aside>
<main class='ml-64 flex-1 flex flex-col p-lg gap-lg overflow-y-auto'>
<header></header>
<section class='flex justify-between items-end mt-sm'>
<div><h2 class='font-headline-lg text-headline-lg text-on-surface'>Mijozlar Bazasi</h2><p class='text-on-surface-variant font-body-lg'>Sotuvchilarning mijozlari ro'yxati</p></div>
<div class='flex gap-md'><button class='bg-primary text-on-primary px-lg py-sm rounded-xl' onclick='openCustomerModal()'>Yangi Mijoz</button></div>
</section>
<section id='customers-grid' class='grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-lg mt-lg'></section>
</main>
<script src='db.js'></script>
<script src='shared.js'></script>
<script>
let customers=[];
function loadCustomers(){
 const data=window.db.getCustomers();
 const grid=document.getElementById('customers-grid');
 grid.innerHTML='';
 data.forEach(c=>{
   const card=`<div class='glass-panel p-lg rounded-xl shadow border-l-4 border-primary'>
     <div class='flex justify-between items-start mb-sm'>
       <h4 class='font-title-lg font-bold text-on-surface'>${c.name}</h4>
       <div class='flex gap-xs'>
         <button onclick='editCustomer("${c.id}")' class='text-primary hover:bg-primary-container p-1 rounded-md transition-colors'>
           <span class='material-symbols-outlined text-[20px]'>edit</span>
         </button>
         <button onclick='deleteCustomer("${c.id}")' class='text-error hover:bg-error-container p-1 rounded-md transition-colors'>
           <span class='material-symbols-outlined text-[20px]'>delete</span>
         </button>
       </div>
     </div>
     <div class='flex items-center gap-xs text-on-surface-variant mb-xs'>
       <span class='material-symbols-outlined text-[18px]'>call</span>
       <span class='font-body-md'>${c.phone}</span>
     </div>
     <div class='mt-md pt-sm border-t border-outline-variant/30 flex justify-between'>
       <span class='text-on-surface-variant font-label-md'>Tashriflar: ${c.visitCount || 0}</span>
       <span class='text-primary font-bold font-label-md'>Sarfladi: ${c.totalSpent ? new Intl.NumberFormat('uz-UZ').format(c.totalSpent) : 0} UZS</span>
     </div>
   </div>`;
   grid.innerHTML+=card;
 });
}
function deleteCustomer(id) {
    if(confirm('Mijozni o\\'chirishni tasdiqlaysizmi?')) {
        window.db.deleteCustomer(id);
        loadCustomers();
    }
}
function openCustomerModal(){
 const modal=document.getElementById('customer-modal');
 modal.classList.remove('hidden');
 modal.removeAttribute('data-edit-id');
 document.getElementById('cust-name-input').value='';
 document.getElementById('cust-phone-input').value='';
}
function closeCustomerModal(){
 const modal=document.getElementById('customer-modal');
 modal.classList.add('hidden');
 modal.removeAttribute('data-edit-id');
}
function saveCustomer(e){
 e.preventDefault();
 const name=document.getElementById('cust-name-input').value.trim();
 const phone=document.getElementById('cust-phone-input').value.trim();
 if(!name||!phone) return;
 
 const modal=document.getElementById('customer-modal');
 const editId=modal.getAttribute('data-edit-id');
 
 const cust = {name, phone};
 if(editId) cust.id = editId; // db.saveCustomer handles update if id exists

 window.db.saveCustomer(cust);
 closeCustomerModal();
 loadCustomers();
}
function editCustomer(id) {
    const cust = window.db.getCustomers().find(c => c.id === id);
    if(!cust) return;
    
    const modal=document.getElementById('customer-modal');
    modal.classList.remove('hidden');
    modal.setAttribute('data-edit-id', id);
    
    document.getElementById('cust-name-input').value = cust.name || '';
    document.getElementById('cust-phone-input').value = cust.phone || '';
}
window.addEventListener('DOMContentLoaded',()=>{loadCustomers();});
</script>
<div id='customer-modal' class='fixed inset-0 bg-black/40 flex items-center justify-center hidden'>
<div class='bg-surface-container-low p-lg rounded-xl'>
<h3 class='font-headline-md'>Yangi mijoz qo'shish</h3>
<form onsubmit='saveCustomer(event)'>
<label>Ism</label><input id='cust-name-input' class='border rounded w-full' required>
<label>Telefon</label><input id='cust-phone-input' class='border rounded w-full' required>
<button type='submit' class='bg-primary text-on-primary mt-2 px-lg py-sm rounded'>Saqlash</button>
</form>
<button onclick='closeCustomerModal()' class='mt-2'>Yopish</button>
</div>
</div>
</body>
</html>
